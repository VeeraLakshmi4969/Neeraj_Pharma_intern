
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - Neeraj Pharma</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
            background: white;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            padding: 10px 0;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            max-width: 180px;
            height: 50px;
            object-fit: contain;
        }

        .brand-text h4 {
            margin: 0;
            font-size: 22px;
            color: #0d6efd;
            font-weight: bold;
        }

        .brand-text small {
            color: #6c757d;
            font-size: 12px;
        }

        .nav-link {
            color: #333 !important;
            font-weight: 600;
            margin: 0 8px;
        }

        .nav-link:hover {
            color: #198754 !important;
        }

        .details-section {
            padding: 50px 0;
        }

        .details-card {
            background: white;
            border: none;
            border-radius: 15px;
            padding: 30px;
        }

        .product-detail-image {
            width: 100%;
            height: 400px;
            object-fit: contain;
        }

        .product-title {
            font-size: 30px;
            font-weight: bold;
        }

        .company {
            color: #6c757d;
            font-size: 16px;
        }

        .price {
            color: #198754;
            font-size: 28px;
            font-weight: bold;
        }

        .stock {
            color: #198754;
            font-weight: 600;
        }

        .description {
            color: #555;
            line-height: 1.7;
        }

        .wishlist-btn {
            font-size: 18px;
        }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg sticky-top">

    <div class="container">

        <a class="navbar-brand" href="products.html">

            <img
                src="neeraj pharma.jpeg"
                class="logo img-fluid"
                alt="Neeraj Pharma"
            >

            <div class="brand-text">

                <h4>Neeraj Pharma</h4>

                <small>
                    Your Trusted Healthcare Partner
                </small>

            </div>

        </a>


        <div class="d-flex align-items-center">

            <a
                href="products.html"
                class="nav-link"
            >
                Products
            </a>
<a
    href="cart.html"
    class="text-dark fs-4 ms-3"
    title="Wishlist"
>
    <i class="bi bi-heart"></i>
</a>

            <a
                href="#"
                class="text-dark fs-4 ms-3"
            >
                <i class="bi bi-cart3"></i>
            </a>

        </div>

    </div>

</nav>


<!-- ================= PRODUCT DETAILS ================= -->

<section class="details-section">

    <div class="container">

        <!-- Back button -->

        <a
            href="products.html"
            class="btn btn-outline-success mb-4"
        >
            <i class="bi bi-arrow-left me-1"></i>
            Back to Products
        </a>


        <div class="card details-card shadow-sm">

            <div class="row align-items-center">

                <!-- Product Image -->

                <div class="col-md-6 text-center">

                    <img
                        id="productImage"
                        class="product-detail-image"
                        src=""
                        alt="Product"
                    >

                </div>


                <!-- Product Information -->

                <div class="col-md-6">

                    <h1
                        id="productName"
                        class="product-title"
                    >
                        Product Name
                    </h1>


                    <p
                        id="productCompany"
                        class="company"
                    >
                        Company
                    </p>


                    <p class="stock">
                        <i class="bi bi-check-circle-fill me-1"></i>
                        In Stock
                    </p>


                    <hr>


                    <p
                        id="productPrice"
                        class="price"
                    >
                        ₹0
                    </p>


                    <h5 class="fw-bold">
                        Product Description
                    </h5>


                    <p
                        id="productDescription"
                        class="description"
                    >
                        Product description
                    </p>


                    <!-- Buttons -->

                    <div class="d-flex gap-3 mt-4">

                        <button
                            id="wishlistButton"
                            class="btn btn-outline-success wishlist-btn"
                        >
                            <i class="bi bi-heart me-1"></i>
                            Add to Wishlist
                        </button>


                        <button
                            id="cartButton"
                            class="btn btn-success wishlist-btn"
                        >
                            <i class="bi bi-cart-plus me-1"></i>
                            Add to Cart
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<script>

    // =====================================
    // PRODUCT DATA
    // =====================================

    const products = [

        {
            id: 1,
            name: "Dolo 650 Tablet",
            company: "Micro Labs Ltd.",
            price: 35,
            image: "dolo.jpeg",
            description:
                "Dolo 650 Tablet is one of the healthcare products available at Neeraj Pharma."
        },

        {
            id: 2,
            name: "Vitamin C Tablets",
            company: "HealthKart",
            price: 250,
            image: "vitamin c.jpeg",
            description:
                "Vitamin C Tablets are available at Neeraj Pharma."
        },

        {
            id: 3,
            name: "Foracort 200 Rotacaps",
            company: "Cipla Ltd.",
            price: 185,
            image: "foracort.webp",
            description:
                "Foracort 200 Rotacaps are available at Neeraj Pharma."
        },

        {
            id: 4,
            name: "Pantocid 40mg Tablet",
            company: "Sun Pharmaceutical Industries Ltd",
            price: 165,
            image: "PANTOCID-40.jpg",
            description:
                "Pantocid 40mg Tablet is available at Neeraj Pharma."
        },

        {
            id: 5,
            name: "Volini Pain Relief Spray",
            company: "Sun Pharma Consumer Healthcare",
            price: 245,
            image: "VOLINI.webp",
            description:
                "Volini Pain Relief Spray is available at Neeraj Pharma."
        },

        {
            id: 6,
            name: "Revital H",
            company: "Sun Pharma Consumer Healthcare",
            price: 310,
            image: "REVITAL.jpeg",
            description:
                "Revital H is available at Neeraj Pharma."
        }

    ];


    // =====================================
    // GET PRODUCT ID FROM URL
    // =====================================

    const urlParams =
        new URLSearchParams(window.location.search);

    const productId =
        Number(urlParams.get("id"));


    // =====================================
    // FIND PRODUCT
    // =====================================

    const product =
        products.find(item => item.id === productId);


    // =====================================
    // DISPLAY PRODUCT
    // =====================================

    if (product) {

        document.getElementById("productImage").src =
            product.image;

        document.getElementById("productImage").alt =
            product.name;

        document.getElementById("productName").textContent =
            product.name;

        document.getElementById("productCompany").textContent =
            product.company;

        document.getElementById("productPrice").textContent =
            "₹" + product.price;

        document.getElementById("productDescription").textContent =
            product.description;

    } else {

        document.getElementById("productName").textContent =
            "Product Not Found";

        document.getElementById("productCompany").textContent =
            "";

        document.getElementById("productPrice").textContent =
            "";

        document.getElementById("productDescription").textContent =
            "The requested product could not be found.";

    }

// =====================================
// WISHLIST
// =====================================

// Get existing wishlist
function getWishlist() {
    return JSON.parse(localStorage.getItem("wishlist")) || [];
}


// Save wishlist
function saveWishlist(wishlist) {
    localStorage.setItem(
        "wishlist",
        JSON.stringify(wishlist)
    );
}


// Add product to wishlist
function addToWishlist() {

    if (!product) {
        return;
    }

    let wishlist = getWishlist();

    // Check whether product is already in wishlist
    const existingProduct = wishlist.find(
        item => item.name === product.name
    );


    // If already present, remove it
    if (existingProduct) {

        wishlist = wishlist.filter(
            item => item.name !== product.name
        );

        saveWishlist(wishlist);

        updateWishlistButton();

        alert("Product removed from Wishlist");

        return;
    }


    // Add product
    wishlist.push({

        name: product.name,

        company: product.company,

        image: product.image,

        price: product.price,

        quantity: 1

    });


    // Save to localStorage
    saveWishlist(wishlist);


    // Change button appearance
    updateWishlistButton();


    alert("Product added to Wishlist ❤️");
}


// =====================================
// UPDATE WISHLIST BUTTON
// =====================================

function updateWishlistButton() {

    if (!product) {
        return;
    }

    const wishlist = getWishlist();

    const exists = wishlist.some(
        item => item.name === product.name
    );

    const button =
        document.getElementById("wishlistButton");


    if (exists) {

        button.innerHTML =
            '<i class="bi bi-heart-fill me-1"></i> Wishlisted';

        button.classList.remove(
            "btn-outline-success"
        );

        button.classList.add(
            "btn-success"
        );

    } else {

        button.innerHTML =
            '<i class="bi bi-heart me-1"></i> Add to Wishlist';

        button.classList.remove(
            "btn-success"
        );

        button.classList.add(
            "btn-outline-success"
        );
    }
}


// =====================================
// BUTTON CLICK
// =====================================

document
    .getElementById("wishlistButton")
    .addEventListener("click", addToWishlist);


// =====================================
// CHECK INITIAL WISHLIST STATUS
// =====================================

updateWishlistButton();

// =====================================
// CART
// =====================================

// Get existing cart
function getCart() {
    return JSON.parse(localStorage.getItem("cart")) || [];
}


// Save cart
function saveCart(cart) {
    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );
}


// Add product to cart
function addToCart() {

    if (!product) {
        return;
    }

    let cart = getCart();


    // Check if product already exists
    const existingProduct = cart.find(
        item => item.id === product.id
    );


    if (existingProduct) {

        // Increase quantity
        existingProduct.quantity++;

    } else {

        // Add new product
        cart.push({

            id: product.id,

            name: product.name,

            company: product.company,

            price: product.price,

            image: product.image,

            quantity: 1

        });
    }


    // Save cart
    saveCart(cart);


    // Change button
    const cartButton =
        document.getElementById("cartButton");

    cartButton.innerHTML =
        '<i class="bi bi-check-circle me-1"></i> Added to Cart';


    alert("Product added to Cart 🛒");
}


// =====================================
// CART BUTTON CLICK
// =====================================

document
    .getElementById("cartButton")
    .addEventListener("click", addToCart);

</script>


</body>
</html>
