<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - NeerajPharma</title>
    <link rel="icon" type="image/jpeg" href="neeraj pharma.jpeg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background: #f5f7fa;
        font-family: Arial, Helvetica, sans-serif;
      }
      .navbar {
        background: white;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        padding: 10px 0;
      }
      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        max-width: 180px;
        height: 50px;
        object-fit: contain;
      }
      .brand-text h4 {
        margin: 0;
        font-size: 22px;
        color: #0d6efd;
        font-weight: bold;
      }
      .brand-text small {
        color: #6c757d;
        font-size: 12px;
      }
      .nav-link {
        color: #333 !important;
        font-weight: 600;
        margin: 0 8px;
      }
      .nav-link:hover {
        color: #198754 !important;
      }
      .nav-icon {
        color: #333;
        font-size: 22px;
        margin-left: 20px;
        text-decoration: none;
        position: relative;
      }
      .nav-icon:hover {
        color: #198754;
      }
      .icon-badge {
        position: absolute;
        top: -8px;
        right: -10px;
        min-width: 18px;
        height: 18px;
        background: red;
        color: white;
        font-size: 10px;
        font-weight: bold;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
      }
      .details-section {
        padding: 50px 0;
      }
      .details-card {
        background: white;
        border: none;
        border-radius: 15px;
        padding: 30px;
      }
      .product-detail-image {
        width: 100%;
        height: 400px;
        object-fit: contain;
      }
      .product-title {
        font-size: 30px;
        font-weight: bold;
      }
      .company {
        color: #6c757d;
        font-size: 16px;
      }
      .price {
        color: #198754;
        font-size: 28px;
        font-weight: bold;
      }
      .stock {
        color: #198754;
        font-weight: 600;
      }
      .description {
        color: #555;
        line-height: 1.7;
      }
      .action-button {
        font-size: 17px;
      }
      @media (max-width: 767px) {
        .brand-text {
          display: none;
        }
        .logo {
          max-width: 140px;
        }
        .product-detail-image {
          height: 280px;
        }
        .product-title {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="products.html">
          <img
            src="neeraj pharma.jpeg"
            class="logo img-fluid"
            alt="Neeraj Pharma"
          />
          <div class="brand-text">
            <h4>NeerajPharma</h4>
            <small> Your Trusted Healthcare Partner </small>
          </div>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="products.html"> Home </a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="products.html"> Products </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"> Categories </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"> About </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"> Contact </a>
            </li>
          </ul>
          <ul>
            <form class = "d-flex" role="search">
              <input class = "form-control me-2" type = "search" placeholder="Search here" aria-label="Seach">
              <button class = "btn  btn-outline-success" type = "submit">Search</button>
            </form>
          </ul>
          <div class="d-flex align-items-center">
            <a href="wishlist.html" class="nav-icon" title="Wishlist">
              <i class="bi bi-heart"></i>
              <span id="wishlist-badge" class="icon-badge"> 0 </span>
            </a>
            <a href="cart.html" class="nav-icon" title="Cart">
              <i class="bi bi-cart3"></i>
              <span id="cart-badge" class="icon-badge"> 0 </span>
            </a>
          </div>
        </div>
      </div>
    </nav>
    <section class="details-section">
      <div class="container">
        <a href="products.html" class="btn btn-outline-success mb-4">
          <i class="bi bi-arrow-left me-1"></i>
          Back to Products
        </a>
        <div id="details-container" class="card details-card shadow-sm">
          <div class="row align-items-center">
            <div class="col-md-6 text-center">
              <img
                id="productImage"
                class="product-detail-image"
                src=""
                alt="Product"
              />
            </div>
            <div class="col-md-6">
              <h1 id="productName" class="product-title">Product Name</h1>
              <p id="productCompany" class="company">Company</p>
              <p class="stock">
                <i class="bi bi-check-circle-fill me-1"></i>
                In Stock
              </p>
              <hr />
              <p id="productPrice" class="price">₹0</p>
              <h5 class="fw-bold">Product Description</h5>
              <p id="productDescription" class="description">
                Product description
              </p>
              <div class="d-flex gap-3 mt-4 flex-wrap">
                <button
                  id="wishlistButton"
                  class="btn btn-outline-success action-button"
                >
                  <i class="bi bi-heart me-1"></i>
                  Add to Wishlist
                </button>
                <button id="cartButton" class="btn btn-success action-button">
                  <i class="bi bi-cart-plus me-1"></i>
                  Add to Cart
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="products.js"></script>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const productId = Number(urlParams.get("id"));
      const product = getProductById(productId);
      const productImage = document.getElementById("productImage");
      const productName = document.getElementById("productName");
      const productCompany = document.getElementById("productCompany");
      const productPrice = document.getElementById("productPrice");
      const productDescription = document.getElementById("productDescription");
      const wishlistButton = document.getElementById("wishlistButton");
      const cartButton = document.getElementById("cartButton");
      if (product) {
        productImage.src = product.image;
        productImage.alt = product.name;
        productName.textContent = product.name;
        productCompany.textContent = product.company;
        productPrice.textContent = "₹" + product.price;
        productDescription.textContent = product.description;
      } else {
        productImage.style.display = "none";
        productName.textContent = "Product Not Found";
        productCompany.textContent = "";
        productPrice.textContent = "";
        productDescription.textContent =
          "The requested product could not be found.";
        wishlistButton.style.display = "none";
        cartButton.style.display = "none";
      }
      function updateWishlistButton() {
        if (!product) {
          return;
        }
        const exists = isProductWishlisted(product.id);
        if (exists) {
          wishlistButton.innerHTML =
            '<i class="bi bi-heart-fill me-1"></i> Wishlisted';
          wishlistButton.classList.remove("btn-outline-success");
          wishlistButton.classList.add("btn-success");
        } else {
          wishlistButton.innerHTML =
            '<i class="bi bi-heart me-1"></i> Add to Wishlist';
          wishlistButton.classList.remove("btn-success");
          wishlistButton.classList.add("btn-outline-success");
        }
      }
      wishlistButton.addEventListener("click", function () {
        if (!product) {
          return;
        }
        toggleWishlist(product);
        updateWishlistButton();
        updateBadges();
      });
      cartButton.addEventListener("click", function () {
        if (!product) {
          return;
        }
        addProductToCart(product);
        cartButton.innerHTML =
          '<i class="bi bi-check-circle me-1"></i> Added to Cart';
        setTimeout(function () {
          cartButton.innerHTML =
            '<i class="bi bi-cart-plus me-1"></i> Add to Cart';
        }, 1500);
        updateBadges();
      });
      updateWishlistButton();
      updateBadges();
    </script>
  </body>
</html>
