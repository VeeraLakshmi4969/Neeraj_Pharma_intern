<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - NeerajPharma</title>
    <link rel="icon" type="image/jpeg" href="neeraj pharma.jpeg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        background: #f5f7fa;
        font-family: Arial, Helvetica, sans-serif;
      }
      .navbar {
        background: white;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        padding: 10px 0;
      }
      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        max-width: 180px;
        height: 50px;
        object-fit: contain;
      }
      .brand-text h4 {
        margin: 0;
        font-size: 22px;
        color: #0d6efd;
        font-weight: bold;
      }
      .brand-text small {
        color: #6c757d;
        font-size: 12px;
      }
      .nav-link {
        color: #333 !important;
        font-weight: 600;
        margin: 0 8px;
      }

      .nav-link:hover {
        color: #198754 !important;
      }
      .nav-icon {
        color: #333;
        font-size: 22px;
        margin-left: 20px;
        text-decoration: none;
        position: relative;
      }
      .nav-icon:hover {
        color: #198754;
      }
      .icon-badge {
        position: absolute;
        top: -8px;
        right: -10px;
        min-width: 18px;
        height: 18px;
        background: red;
        color: white;
        font-size: 10px;
        font-weight: bold;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
      }

      .cart-card {
        border: none;
        border-radius: 12px;
        background: white;
        overflow: hidden;
      }

      .product-image {
        max-width: 100%;
        height: 130px;
        object-fit: contain;
      }
      .stock {
        color: #198754;
        font-size: 13px;
        font-weight: 600;
      }
      .delivery {
        color: #6c757d;
        font-size: 13px;
      }
      .price {
        font-size: 20px;
        font-weight: 700;
        color: #212529;
      }
      .quantity-box {
        display: flex;
        align-items: center;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        overflow: hidden;
        background: #f8f9fa;
      }
      .quantity-btn {
        border: none;
        background: transparent;
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .quantity-btn:hover {
        background: #e9ecef;
      }
      .qty {
        padding: 0 12px;
        font-weight: 600;
      }
      .order-summary {
        border: none;
        border-radius: 12px;
        position: sticky;
        top: 90px;
      }
      .empty-cart {
        padding: 70px 20px;
      }
      @media (max-width: 991px) {
        .order-summary {
          position: static;
          margin-top: 20px;
        }
      }
      @media (max-width: 767px) {
        .brand-text {
          display: none;
        }
        .logo {
          max-width: 140px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="products.html">
          <img
            src="neeraj pharma.jpeg"
            class="logo img-fluid"
            alt="Neeraj Pharma"
          />
          <div class="brand-text">
            <h4>NeerajPharma</h4>
            <small> Your Trusted Healthcare Partner </small>
          </div>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="products.html"> Home </a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="products.html"> Products </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"> Categories </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"> About </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"> Contact </a>
            </li>
          </ul>
          <ul>
            <form class="d-flex" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search here"
                aria-label="Search"
              />
              <button class="btn btn-outline-success" type = "submit">Search</button>
            </form>
            
          </ul>

          <div class="d-flex align-items-center">
            <a href="wishlist.html" class="nav-icon" title="Wishlist">
              <i class="bi bi-heart"></i>
              <span id="wishlist-badge" class="icon-badge"> 0 </span>
            </a>
            <a href="cart.html" class="nav-icon" title="Cart">
              <i class="bi bi-cart3"></i>
              <span id="cart-badge" class="icon-badge"> 0 </span>
            </a>
            <div class="profile-menu-container">
  <!-- Clickable Icon -->
  <div class="profile-icon" onclick="toggleMenu()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
      <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
      <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
    </svg>
  </div>

  <!-- Dropdown Options -->
  <div id="dropdownMenu" class="dropdown-content">
    <a href="#profile">Profile</a>
    <a href="#logout">Logout</a>
  </div>
</div>

<style>
 .profile-menu-container {
  position: relative;
  display: inline-block;
  margin-left: 25px;
}
  .profile-icon {
    cursor: pointer;
  }
  .dropdown-content {
    display: none;
    position: absolute;
    right: 0;
    background-color: #ffffff;
    min-width: 120px;
    box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
    border-radius: 4px;
    z-index: 1;
  }
  .dropdown-content a {
    color: #333;
    padding: 10px 14px;
    text-decoration: none;
    display: block;
    font-family: sans-serif;
    font-size: 14px;
  }
  .dropdown-content a:hover {
    background-color: #f1f1f1;
  }
  .show {
    display: block;
  }
</style>

<script>
  function toggleMenu() {
    document.getElementById("dropdownMenu").classList.toggle("show");
  }

  // Close the dropdown if the user clicks outside of it
  window.onclick = function(event) {
    if (!event.target.closest('.profile-menu-container')) {
      var dropdowns = document.getElementsByClassName("dropdown-content");
      for (var i = 0; i < dropdowns.length; i++) {
        var openDropdown = dropdowns[i];
        if (openDropdown.classList.contains('show')) {
          openDropdown.classList.remove('show');
        }
      }
    }
  }
</script>


          </div>
        </div>
      </div>
    </nav>
    <div class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="fw-bold mb-1">
          <p class="text-muted mb-0">
            <span id="cart-item-count"></span>
          </p>
        </div>
        <a href="products.html" class="btn btn-outline-success">
          <i class="bi bi-arrow-left me-1"></i>
          Continue Shopping
        </a>
      </div>
      <div class="row g-4">
        <div class="col-lg-8">
          <div id="cart-items"></div>
        </div>
        <div class="col-lg-4">
          <div class="card shadow-sm order-summary">
            <div class="card-header bg-success text-white">
              <h5 class="mb-0">
                <i class="bi bi-receipt me-2"></i>
                Order Summary
              </h5>
            </div>
            <div class="card-body">
              <div class="d-flex justify-content-between mb-3">
                <span> Subtotal </span>
                <span id="subtotal"> ₹0 </span>
              </div>
              <div class="d-flex justify-content-between mb-3">
                <span> Discount </span>
                <span id="discount" class="text-success"> - ₹0 </span>
              </div>
              <div class="d-flex justify-content-between mb-3">
                <span> Delivery </span>
                <span class="text-success"> FREE </span>
              </div>
              <div class="d-flex justify-content-between mb-3">
                <span> GST </span>
                <span id="gst"> ₹0 </span>
              </div>
              <hr />
              <div class="d-flex justify-content-between align-items-center">
                <h5 class="fw-bold">Total</h5>

                <h5 id="total" class="fw-bold text-success">₹0</h5>
              </div>
              <div class="mt-4">
                <label class="fw-semibold mb-2"> Have a coupon? </label>
                <div class="input-group">
                  <input
                    id="couponInput"
                    type="text"
                    class="form-control"
                    placeholder="Enter coupon code"
                  />
                  <button id="couponButton" class="btn btn-outline-success">
                    Apply
                  </button>
                </div>
                <small id="couponMessage" class="d-block mt-2"></small>
              </div>
              <button
                id="checkoutButton"
                class="btn btn-success w-100 mt-4 py-2 fw-semibold"
              >
                <i class="bi bi-lock-fill me-1"></i>
                Proceed to Checkout
              </button>
              <p class="text-center text-muted small mt-3 mb-0">
                <i class="bi bi-shield-check me-1"></i>
                Secure checkout
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="products.js"></script>
    <script>
      const cartItemsContainer = document.getElementById("cart-items");
      const cartCount = document.getElementById("cart-item-count");
      const subtotalElement = document.getElementById("subtotal");
      const discountElement = document.getElementById("discount");
      const gstElement = document.getElementById("gst");
      const totalElement = document.getElementById("total");
      const couponInput = document.getElementById("couponInput");
      const couponButton = document.getElementById("couponButton");
      const couponMessage = document.getElementById("couponMessage");
      let appliedCoupon = "";
      function renderCart() {
        const cart = getCart();
        cartItemsContainer.innerHTML = "";
        if (cart.length === 0) {
          appliedCoupon = "";
          couponInput.value = "";
          couponMessage.textContent = "";
          cartItemsContainer.innerHTML = `
            <div
                class="card shadow-sm border-0 text-center empty-cart"
            >
                <i
                    class="bi bi-cart-x text-success"
                    style="font-size:70px;"
                ></i>
                <h3 class="fw-bold mt-3">
                    Your Cart is Empty
                </h3>
                <p class="text-muted">
                    You haven't added any products to your cart yet.
                </p>
                <div>
                    <a
                        href="products.html"
                        class="btn btn-success"
                    >
                        <i class="bi bi-shop me-1"></i>
                        Browse Products
                    </a>
                </div>
            </div>
        `;
          cartCount.textContent = "0";
          updateSummary();
          updateBadges();
          return;
        }
        cart.forEach(function (item) {
          const card = document.createElement("div");
          card.className = "card cart-card shadow-sm mb-3";
          card.innerHTML = `
            <div class="row g-0 align-items-center">

                <div
                    class="col-md-3 text-center p-3"
                >

                    <img
                        src="${item.image}"
                        class="product-image"
                        alt="${item.name}"
                    >

                </div>


                <div class="col-md-9">

                    <div class="card-body">

                        <div
                            class="d-flex justify-content-between align-items-start"
                        >

                            <div>

                                <h5 class="fw-bold mb-1">
                                    ${item.name}
                                </h5>

                                <p
                                    class="text-muted small mb-1"
                                >
                                    ${item.company}
                                </p>

                                <span class="stock">

                                    <i
                                        class="bi bi-check-circle-fill me-1"
                                    ></i>

                                    In Stock
                                </span>
                                <p
                                    class="delivery mt-1 mb-0"
                                >
                                    <i
                                        class="bi bi-truck me-1"
                                    ></i>
                                    Delivery by Tomorrow
                                </p>
                            </div>
                            <button
                                class="btn btn-outline-danger btn-sm delete-btn"
                                title="Remove"
                            >
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                        <div
                            class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top"
                        >
                            <div class="quantity-box">
                                <button
                                    class="quantity-btn minus"
                                    title="Decrease quantity"
                                >
                                    <i class="bi bi-dash"></i>
                                </button>
                                <span class="qty">
                                    ${item.quantity}
                                </span>
                                <button
                                    class="quantity-btn plus"
                                    title="Increase quantity"
                                >
                                    <i class="bi bi-plus"></i>
                                </button>
                            </div>
                            <div>
                                <span class="price">
                                    ₹${(
                                      Number(item.price) * Number(item.quantity)
                                    ).toFixed(0)}
                                </span>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button
                                class="btn btn-sm btn-light border save-wishlist-btn"
                            >
                                <i class="bi bi-heart me-1"></i>
                                Save for Later
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
          card.querySelector(".plus").addEventListener("click", function () {
            updateCartQuantity(item.id, Number(item.quantity) + 1);
            renderCart();
          });
          card.querySelector(".minus").addEventListener("click", function () {
            const newQuantity = Number(item.quantity) - 1;
            if (newQuantity <= 0) {
              removeProductFromCart(item.id);
            } else {
              updateCartQuantity(item.id, newQuantity);
            }
            renderCart();
          });
          card
            .querySelector(".delete-btn")
            .addEventListener("click", function () {
              removeProductFromCart(item.id);
              renderCart();
            });
          const saveButton = card.querySelector(".save-wishlist-btn");
          if (isProductWishlisted(item.id)) {
            saveButton.classList.add("text-success");
            saveButton.innerHTML =
              '<i class="bi bi-heart-fill me-1"></i> Wishlisted';
          }
          saveButton.addEventListener("click", function () {
            const product = getProductById(item.id);
            if (!product) {
              return;
            }
            const added = toggleWishlist(product);
            if (added) {
              saveButton.classList.add("text-success");
              saveButton.innerHTML =
                '<i class="bi bi-heart-fill me-1"></i> Wishlisted';
            } else {
              saveButton.classList.remove("text-success");
              saveButton.innerHTML =
                '<i class="bi bi-heart me-1"></i> Save for Later';
            }
          });
          cartItemsContainer.appendChild(card);
        });
        const totalQuantity = cart.reduce(function (total, item) {
          return total + Number(item.quantity);
        }, 0);
        cartCount.textContent = totalQuantity;
        updateSummary();
        updateBadges();
      }
      function updateSummary() {
        const cart = getCart();
        let subtotal = 0;
        cart.forEach(function (item) {
          subtotal += Number(item.price) * Number(item.quantity);
        });
        let discount = 0;
        if (appliedCoupon === "NEERAJ100") {
          discount = Math.min(100, subtotal);
        }
        const gst = subtotal * 0.05;
        const delivery = 0;
        const total = subtotal - discount + gst + delivery;
        subtotalElement.textContent = "₹" + subtotal.toFixed(0);
        discountElement.textContent = "- ₹" + discount.toFixed(0);
        gstElement.textContent = "₹" + gst.toFixed(0);
        totalElement.textContent = "₹" + total.toFixed(0);
      }
      couponButton.addEventListener("click", function () {
        const code = couponInput.value.trim().toUpperCase();
        if (code === "NEERAJ100") {
          if (getCart().length === 0) {
            couponMessage.textContent = "Add products to your cart first.";
            couponMessage.className = "d-block mt-2 text-danger";
            return;
          }
          appliedCoupon = "NEERAJ100";
          couponMessage.textContent =
            "Coupon applied successfully. ₹100 discount added.";
          couponMessage.className = "d-block mt-2 text-success";
          updateSummary();
        } else {
          appliedCoupon = "";
          couponMessage.textContent = "Invalid coupon code.";
          couponMessage.className = "d-block mt-2 text-danger";
          updateSummary();
        }
      });
      document
        .getElementById("checkoutButton")
        .addEventListener("click", function () {
          const cart = getCart();
          if (cart.length === 0) {
            alert("Your cart is empty.");
            return;
          }
          alert(
            "Checkout functionality can be connected to your payment/order system.",
          );
        });
      renderCart();
      updateBadges();
    </script>
  </body>
</html>
