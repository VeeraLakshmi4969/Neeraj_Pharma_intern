<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist - NeerajPharma</title>
    <link rel="icon" type="image/jpeg" href="neeraj pharma.jpeg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      /* FORCE DISABLED "ALREADY ADDED" BUTTON TO STAY GREEN */
      .btn-success:disabled,
      .btn-success[disabled],
      button.btn-success:disabled {
        background-color: #198754 !important;
        border-color: #198754 !important;
        color: #ffffff !important;
        opacity: 1 !important;
        cursor: not-allowed !important;
      }
      * {
        box-sizing: border-box;
      }
      body {
        background: #f5f7fa;
        font-family: Arial, Helvetica, sans-serif;
      }
      .navbar {
        background: white;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        padding: 10px 0;
      }
      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        max-width: 180px;
        height: 50px;
        object-fit: contain;
      }
      .brand-text h4 {
        margin: 0;
        font-size: 22px;
        color: #0d6efd;
        font-weight: bold;
      }
      .brand-text small {
        color: #6c757d;
        font-size: 12px;
      }
      .nav-link {
        color: #333 !important;
        font-weight: 600;
        margin: 0 8px;
      }
      .nav-link:hover {
        color: #198754 !important;
      }
      .nav-icon {
        color: #333;
        font-size: 22px;
        margin-left: 20px;
        text-decoration: none;
        position: relative;
      }
      .nav-icon:hover {
        color: #198754;
      }
      .icon-badge {
        position: absolute;
        top: -8px;
        right: -10px;
        min-width: 18px;
        height: 18px;
        background: red;
        color: white;
        font-size: 10px;
        font-weight: bold;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 4px;
      }
      .wishlist-section {
        padding: 50px 0;
      }
      .wishlist-card {
        border: none;
        border-radius: 12px;
        background: white;
        height: 100%;
        transition: 0.3s;
      }
      .wishlist-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      }
      .wishlist-image {
        width: 100%;
        height: 220px;
        object-fit: contain;
        padding: 20px;
      }
      .company {
        color: #6c757d;
        font-size: 14px;
      }
      .price {
        color: #198754;
        font-size: 22px;
        font-weight: bold;
      }
      .empty-wishlist {
        padding: 80px 20px;
      }
      .profile-menu-container {
        position: relative;
        display: inline-block;
        margin-left: 25px;
      }
      .profile-icon {
        cursor: pointer;
      }
      .dropdown-content {
        display: none;
        position: absolute;
        right: 0;
        background-color: #ffffff;
        min-width: 120px;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
        border-radius: 4px;
        z-index: 1;
      }
      .dropdown-content a {
        color: #333;
        padding: 10px 14px;
        text-decoration: none;
        display: block;
        font-family: sans-serif;
        font-size: 14px;
      }
      .dropdown-content a:hover {
        background-color: #f1f1f1;
      }
      .show {
        display: block;
      }
      @media (max-width: 767px) {
        .brand-text {
          display: none;
        }
        .logo {
          max-width: 140px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="products.html">
          <img
            src="neeraj pharma.jpeg"
            class="logo img-fluid"
            alt="Neeraj Pharma"
          />
          <div class="brand-text">
            <h4>NeerajPharma</h4>
            <small> Your Trusted Healthcare Partner </small>
          </div>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="products.html"> Home </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html"> Products </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"> Categories </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Policy</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"> About </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#"> Contact </a>
            </li>
          </ul>

          <!-- SEARCH FORM -->
          <form class="d-flex" role="search" onsubmit="event.preventDefault();">
            <input
              id="wishlist-search-input"
              class="form-control me-2"
              type="search"
              placeholder="Search in wishlist..."
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="button">Search</button>
          </form>

          <div class="d-flex align-items-center">
            <a href="wishlist.html" class="nav-icon" title="Wishlist">
              <i class="bi bi-heart"></i>
              <span id="wishlist-badge" class="icon-badge"> 0 </span>
            </a>
            <a href="cart.html" class="nav-icon" title="Cart">
              <i class="bi bi-cart3"></i>
              <span id="cart-badge" class="icon-badge"> 0 </span>
            </a>
            <div class="profile-menu-container">
              <div class="profile-icon" onclick="toggleMenu()">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  fill="currentColor"
                  class="bi bi-person-circle"
                  viewBox="0 0 16 16"
                >
                  <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
                  <path
                    fill-rule="evenodd"
                    d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"
                  />
                </svg>
              </div>

              <div id="dropdownMenu" class="dropdown-content">
                <a href="#profile">Profile</a>
                <a href="#logout">Logout</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <section class="wishlist-section">
      <div class="container">
        <div id="wishlist-container" class="row g-4"></div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="products.js"></script>
    <script>
      function toggleMenu() {
        document.getElementById("dropdownMenu").classList.toggle("show");
      }

      window.onclick = function (event) {
        if (!event.target.closest(".profile-menu-container")) {
          var dropdowns = document.getElementsByClassName("dropdown-content");
          for (var i = 0; i < dropdowns.length; i++) {
            var openDropdown = dropdowns[i];
            if (openDropdown.classList.contains("show")) {
              openDropdown.classList.remove("show");
            }
          }
        }
      };

      const wishlistSearchInput = document.getElementById("wishlist-search-input");

      function renderWishlist(filterTerm = "") {
        const container = document.getElementById("wishlist-container");
        const fullWishlist = typeof getWishlist === "function" ? getWishlist() : [];

        // Filter items based on product name or company name
        const wishlist = fullWishlist.filter(function (item) {
          const name = item.name ? item.name.toLowerCase() : "";
          const company = item.company ? item.company.toLowerCase() : "";
          const query = filterTerm.toLowerCase().trim();
          return name.includes(query) || company.includes(query);
        });

        container.innerHTML = "";

        if (fullWishlist.length === 0) {
          container.innerHTML = `
            <div class="col-12">
                <div class="card border-0 shadow-sm text-center empty-wishlist">
                    <i class="bi bi-heart text-success" style="font-size:80px;"></i>
                    <h3 class="fw-bold mt-3">Your Wishlist is Empty</h3>
                    <p class="text-muted">You haven't added any products to your wishlist yet.</p>
                    <div>
                      <a href="products.html" class="btn btn-success">
                          <i class="bi bi-shop me-1"></i> Browse Products
                      </a>
                    </div>
                </div>
            </div>
          `;
          if (typeof updateBadges === "function") updateBadges();
          return;
        }

        if (wishlist.length === 0) {
          container.innerHTML = `
            <div class="col-12 text-center py-5">
              <i class="bi bi-search text-muted" style="font-size: 3rem;"></i>
              <h4 class="text-muted mt-3">No wishlist items match your search</h4>
              <p class="text-secondary">Try searching for a different product name or company.</p>
            </div>
          `;
          return;
        }

        wishlist.forEach(function (item) {
          const col = document.createElement("div");
          col.className = "col-md-6 col-lg-4";

          col.innerHTML = `
            <div class="card wishlist-card shadow-sm">
                <img
                    src="${item.image}"
                    class="wishlist-image"
                    alt="${item.name}"
                >
                <div class="card-body">
                    <h5 class="fw-bold">
                        ${item.name}
                    </h5>
                    <p class="company">
                        ${item.company || ""}
                    </p>
                    <p class="price">
                        ₹${Number(item.price).toFixed(0)}
                    </p>
                    <div class="d-flex gap-2 mt-3">
                        <button
                            data-product-id="${item.id}"
                            class="btn btn-success flex-grow-1 add-cart-btn"
                        >
                            <i class="bi bi-cart-plus me-1"></i>
                            Add to Cart
                        </button>
                        <button
                            class="btn btn-outline-danger remove-btn"
                            title="Remove from Wishlist"
                        >
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
          `;

          const addCartButton = col.querySelector(".add-cart-btn");
          addCartButton.addEventListener("click", function () {
            const product = {
              id: Number(item.id),
              name: item.name,
              company: item.company,
              price: Number(item.price),
              image: item.image,
            };

            if (typeof addProductToCart === "function") {
              addProductToCart(product);
            }
          });

          const removeButton = col.querySelector(".remove-btn");
          removeButton.addEventListener("click", function () {
            if (typeof removeFromWishlist === "function") {
              removeFromWishlist(item.id);
            }
            renderWishlist(wishlistSearchInput ? wishlistSearchInput.value : "");
          });

          container.appendChild(col);
        });

        if (typeof renderProductButtons === "function") renderProductButtons();
        if (typeof updateBadges === "function") updateBadges();
      }

      // Initial Render
      renderWishlist();

      // Wishlist Search Input Listener
      if (wishlistSearchInput) {
        wishlistSearchInput.addEventListener("input", function (e) {
          renderWishlist(e.target.value);
        });
      }
    </script>
  </body>
</html>
