<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wishlist - Neeraj Pharma</title>

    <link
        rel="icon"
        type="image/jpeg"
        href="neeraj pharma.jpeg"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: Arial, Helvetica, sans-serif;
        }

        .navbar {
            background: white;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            padding: 10px 0;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            max-width: 180px;
            height: 50px;
            object-fit: contain;
        }

        .brand-text h4 {
            margin: 0;
            font-size: 22px;
            color: #0d6efd;
            font-weight: bold;
        }

        .brand-text small {
            color: #6c757d;
            font-size: 12px;
        }

        .nav-link {
            color: #333 !important;
            font-weight: 600;
            margin: 0 8px;
        }

        .nav-link:hover {
            color: #198754 !important;
        }

        .nav-icon {
            color: #333;
            font-size: 22px;
            margin-left: 20px;
            text-decoration: none;
            position: relative;
        }

        .nav-icon:hover {
            color: #198754;
        }

        .icon-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            min-width: 18px;
            height: 18px;
            background: red;
            color: white;
            font-size: 10px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .wishlist-section {
            padding: 50px 0;
        }

        .wishlist-card {
            border: none;
            border-radius: 12px;
            background: white;
            height: 100%;
            transition: 0.3s;
        }

        .wishlist-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .wishlist-image {
            width: 100%;
            height: 220px;
            object-fit: contain;
            padding: 20px;
        }

        .company {
            color: #6c757d;
            font-size: 14px;
        }

        .price {
            color: #198754;
            font-size: 22px;
            font-weight: bold;
        }

        .empty-wishlist {
            padding: 80px 20px;
        }

        @media (max-width: 767px) {

            .brand-text {
                display: none;
            }

            .logo {
                max-width: 140px;
            }

        }

    </style>

</head>


<body>


<nav class="navbar navbar-expand-lg sticky-top">

    <div class="container">

        <a
            class="navbar-brand"
            href="products.html"
        >

            <img
                src="neeraj pharma.jpeg"
                class="logo"
                alt="Neeraj Pharma"
            >

            <div class="brand-text">

                <h4>
                    Neeraj Pharma
                </h4>

                <small>
                    Your Trusted Healthcare Partner
                </small>

            </div>

        </a>


        <div class="d-flex align-items-center">

            <a
                href="products.html"
                class="nav-link"
            >
                Products
            </a>


            <a
                href="wishlist.html"
                class="nav-icon"
                title="Wishlist"
            >

                <i class="bi bi-heart-fill"></i>

                <span
                    id="wishlist-badge"
                    class="icon-badge"
                >
                    0
                </span>

            </a>


            <a
                href="cart.html"
                class="nav-icon"
                title="Cart"
            >

                <i class="bi bi-cart3"></i>

                <span
                    id="cart-badge"
                    class="icon-badge"
                >
                    0
                </span>

            </a>

        </div>

    </div>

</nav>


<section class="wishlist-section">

    <div class="container">

        <div class="text-center mb-5">

            <h2 class="text-success fw-bold">

                <i class="bi bi-heart-fill me-2"></i>

                My Wishlist

            </h2>

            <p class="text-muted">
                Products you have saved for later
            </p>

        </div>


        <div
            id="wishlist-container"
            class="row g-4"
        ></div>

    </div>

</section>


<script src="products.js"></script>


<script>

function renderWishlist() {

    const wishlist =
        getWishlist();

    const container =
        document.getElementById(
            "wishlist-container"
        );


    container.innerHTML = "";


    if (wishlist.length === 0) {

        container.innerHTML = `

            <div class="col-12">

                <div
                    class="card border-0 shadow-sm text-center empty-wishlist"
                >

                    <i
                        class="bi bi-heart text-success"
                        style="font-size:80px;"
                    ></i>


                    <h3 class="fw-bold mt-3">
                        Your Wishlist is Empty
                    </h3>


                    <p class="text-muted">
                        You haven't added any products to your wishlist yet.
                    </p>


                    <div>

                        <a
                            href="products.html"
                            class="btn btn-success"
                        >

                            <i class="bi bi-shop me-1"></i>

                            Browse Products

                        </a>

                    </div>

                </div>

            </div>

        `;

        updateBadges();

        return;
    }


    wishlist.forEach(function (item) {

        const col =
            document.createElement(
                "div"
            );

        col.className =
            "col-md-6 col-lg-4";


        col.innerHTML = `

            <div
                class="card wishlist-card shadow-sm"
            >

                <img
                    src="${item.image}"
                    class="wishlist-image"
                    alt="${item.name}"
                >


                <div class="card-body">

                    <h5 class="fw-bold">
                        ${item.name}
                    </h5>


                    <p class="company">
                        ${item.company}
                    </p>


                    <p class="price">
                        ₹${item.price}
                    </p>


                    <div
                        class="d-flex gap-2 mt-3"
                    >

                        <button
                            class="btn btn-success flex-grow-1 add-cart-btn"
                        >

                            <i class="bi bi-cart-plus me-1"></i>

                            Add to Cart

                        </button>


                        <button
                            class="btn btn-outline-danger remove-btn"
                            title="Remove from Wishlist"
                        >

                            <i class="bi bi-trash"></i>

                        </button>

                    </div>

                </div>

            </div>

        `;


        const addCartButton =
            col.querySelector(
                ".add-cart-btn"
            );


        addCartButton.addEventListener(
            "click",
            function () {

                const product =
                    getProductById(
                        item.id
                    );


                if (!product) {
                    return;
                }


                addProductToCart(product);


                addCartButton.innerHTML =
                    '<i class="bi bi-check-circle me-1"></i> Added';


                setTimeout(
                    function () {

                        addCartButton.innerHTML =
                            '<i class="bi bi-cart-plus me-1"></i> Add to Cart';

                    },
                    1200
                );

            }
        );


        const removeButton =
            col.querySelector(
                ".remove-btn"
            );


        removeButton.addEventListener(
            "click",
            function () {

                removeFromWishlist(
                    item.id
                );

                renderWishlist();

            }
        );


        container.appendChild(col);

    });


    updateBadges();

}


renderWishlist();

updateBadges();

</script>

</body>

</html>
